name: Deploy develop
on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push backend
        run: |
          docker build -t carlodiazpor/backend-ev:${{ github.sha }} -t carlodiazpor/backend-ev:1.0 .
          docker push carlodiazpor/backend-ev --all-tags

      - name: Build y push imagen de backup
        run: |
          docker build -t carlodiazpor/backup-ev:${{ github.sha }} -t carlodiazpor/backup-ev:1.0 ./backup
          docker push carlodiazpor/backup-ev:${{ github.sha }}
          docker push carlodiazpor/backup-ev:1.0

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Kubeconfig de DigitalOcean
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Aplicar manifiestos
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n backend-ev create secret generic backend-secret \
            --from-literal=DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n backend-ev create secret generic aws-secret \
            --from-literal=AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
            --from-literal=AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            --from-literal=AWS_DEFAULT_REGION=us-east-2 \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/cronjob.yaml -f k8s/mysql.yaml

      - name: Actualizar imagen del backend
        run: |
          kubectl -n backend-ev set image deployment/backend backend=carlodiazpor/backend-ev:${{ github.sha }}
          kubectl -n backend-ev set image cronjob/db-backup backup=carlodiazpor/backup-ev:${{ github.sha }}
          kubectl -n backend-ev rollout status deployment/backend